name: dsh-compat

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: distribution contains no addLanguage
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          ! rg -n "addLanguage" src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:dsh

  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.1-alpha.2', alpha, next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global pnpm@11.25.0
      - run: npm run check:dsh:smoke
        env:
          DSH_CF_DSH_VERSION: ${{ matrix.dsh }}
